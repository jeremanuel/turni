<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- interactive-widget: en Chrome (Android) el teclado achica la ventana
       de verdad, en vez de taparla y dejar el tamaño viejo al cerrarse. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Turni para clubes</title>
  <meta name="description" content="Gestioná los turnos, clientes, pagos y torneos de tu club.">
  <meta name="theme-color" content="#672BEA">

  <!-- Vista previa al compartir el link (WhatsApp, redes) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Turni">
  <meta property="og:title" content="Turni para clubes">
  <meta property="og:description" content="Gestioná los turnos, clientes, pagos y torneos de tu club.">

  <!-- iOS / Android: agregar a la pantalla de inicio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Turni Admin">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: SVG en los navegadores que lo soportan, PNG en el resto -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="manifest" href="manifest.json">

  <style>
    /* Fondo y logo mientras carga Flutter, en vez de una pantalla en blanco. */
    html, body { margin: 0; height: 100%; background: #FEF7FF; }
    @media (prefers-color-scheme: dark) { html, body { background: #151218; } }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; transition: opacity .25s ease; }
    #splash img { width: 72px; height: 72px; border-radius: 16px; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: .55; transform: scale(.96); } 50% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Turni"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <script>
    // Al cerrar el teclado en el celular (sobre todo iPhone y la app
    // instalada) el navegador puede dejar la página corrida o sin avisar el
    // tamaño nuevo: queda una franja con el fondo de la página y la app no se
    // reacomoda. Acá se vuelve la página a su lugar y se le avisa a Flutter.
    // Solo mueve la página del navegador (que en la app siempre está en 0):
    // el scroll de los listados es de Flutter y no se toca.
    (function () {
      var vv = window.visualViewport;
      if (!vv) return;
      var lastHeight = vv.height;
      var timer;
      function settle() {
        if (window.scrollX !== 0 || window.scrollY !== 0) window.scrollTo(0, 0);
        window.dispatchEvent(new Event('resize'));
      }
      vv.addEventListener('resize', function () {
        var closed = vv.height > lastHeight;
        lastHeight = vv.height;
        if (!closed) return;
        // Una vez ya y otra al terminar la animación del teclado.
        settle();
        clearTimeout(timer);
        timer = setTimeout(settle, 350);
      });
      // iPhone: al cerrar el teclado con "OK" la página queda corrida aunque
      // el tamaño no cambie.
      window.addEventListener('focusout', function () {
        clearTimeout(timer);
        timer = setTimeout(function () {
          if (window.scrollX !== 0 || window.scrollY !== 0) settle();
        }, 350);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
